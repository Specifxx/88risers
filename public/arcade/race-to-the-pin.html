<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Race to the Pin · 88 Risers</title>
    <link rel="preload" href="/fonts/saira-extra-condensed-900.woff2" as="font" type="font/woff2" crossorigin>

<body>
    <main aria-label="Race to the Pin game" data-level="rookie">
        <h1><span class="scrap paper">Race</span> <span class="scrap ink">to the</span> <span class="scrap tone">Pin</span></h1>
        <section class="card" aria-label="Armwrestling timing game">
            <div class="grain" aria-hidden="true"></div>
            <div class="top">
                <strong id="round" class="round" aria-live="polite" aria-atomic="true">Ready to pull?</strong>
                <div class="top-controls">
                    <label class="level"><span>Difficulty</span>
                        <select id="difficulty">
                            <option value="rookie">Rookie</option>
                            <option value="club">Club</option>
                            <option value="elite">Elite</option>
                            <option value="kelvinator">Kelvinator</option>

                    <div class="match-controls"><button id="pause" class="secondary" disabled>Pause</button><button id="reset" class="secondary" aria-label="Reset match">Reset</button></div>

            </div>

                    <div class="tint" aria-hidden="true"></div>

                <p class="instruction" id="instruction">Wide arc: hit. Narrow centre: perfect.</p>
